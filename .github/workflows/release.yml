# Publie une release a chaque tag de version : git tag v1.2.0 && git push origin v1.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Mod
        working-directory: mod
        run: |
          dotnet build -c Release
          node tools/eco-translations.mjs check translations/EcoAgora.csv src

      - name: Panel et paquet
        working-directory: panel
        env:
          AGORA_VERSION: ${{ github.ref_name }}
        run: |
          export AGORA_VERSION="${AGORA_VERSION#v}"
          npm ci
          npm run locales:check
          npx vue-tsc --noEmit
          npm run package

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" panel/eco-agora-*.zip \
            --title "Eco Agora ${GITHUB_REF_NAME#v}" \
            --notes "Voir [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). See the changelog for details."

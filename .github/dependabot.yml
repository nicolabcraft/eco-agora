# Mises a jour automatiques des dependances (Dependabot).
# Les assemblies d'Eco (Eco.ReferenceAssemblies) et les bibliotheques fournies
# par le serveur (LiteDB, Newtonsoft.Json) sont exclues : leur version doit
# rester celle du serveur Eco, on les change a la main a chaque version d'Eco.
version: 2
updates:
  - package-ecosystem: npm
    directory: /panel
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      panel:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # three.js est fige sur la version du moteur de carte d'Eco.
      - dependency-name: three
      - dependency-name: '@types/three'
      # TypeScript 7 : vue-tsc ne le supporte pas encore (lib/tsc absent des exports).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Vite 8 (Rolldown) : manualChunks en fonction non supporte, config a refaire.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      # vue-router 5 exige Vite 7 ou plus, a faire avec la montee de Vite.
      - dependency-name: vue-router
        update-types: ['version-update:semver-major']
    labels: [dependencies]

  - package-ecosystem: nuget
    directory: /mod
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      - dependency-name: Eco.ReferenceAssemblies
      - dependency-name: LiteDB
      - dependency-name: Newtonsoft.Json
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [dependencies]
